name: Gohan
options:
  bundleIdPrefix: com.off53jub
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # CI から渡す（.github/workflows/testflight.yml）
    DEVELOPMENT_TEAM: ""
targets:
  Gohan:
    type: application
    platform: iOS
    sources: [Gohan]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.off53jub.gohan
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Gohan/Info.plist
      properties:
        CFBundleDisplayName: ごはん帖
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSPhotoLibraryUsageDescription: ごはんの写真を見つけて、撮った場所と時刻から、どのお店で何を食べたかを記録します。
        # 夜などに、アプリを開いていなくても新しい写真を読む（いつ動くかは iOS が決める）
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [com.off53jub.gohan.scan]
  GohanTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GohanTests]
    dependencies:
      - target: Gohan
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.off53jub.gohan.tests
schemes:
  Gohan:
    build:
      targets:
        Gohan: all
        GohanTests: [test]
    test:
      targets: [GohanTests]
