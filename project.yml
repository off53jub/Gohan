name: Gohan
options:
  bundleIdPrefix: com.off53jub
  developmentLanguage: ja
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # CI から渡す（.github/workflows/testflight.yml）
    DEVELOPMENT_TEAM: ""
targets:
  Gohan:
    type: application
    platform: iOS
    sources: [Gohan]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.off53jub.gohan
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Gohan/Info.plist
      properties:
        CFBundleDisplayName: ごはん帖
        CFBundleDevelopmentRegion: ja
        # CI が Secrets から入れる（無ければ空。端末で入れた鍵があればそちらを使う）
        HotPepperKey: $(HOTPEPPER_KEY)
        GooglePlacesKey: $(GOOGLE_PLACES_KEY)
        YahooAppID: $(YAHOO_APP_ID)
        FoursquareKey: $(FOURSQUARE_KEY)
        ClaudeKey: $(CLAUDE_KEY)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSPhotoLibraryUsageDescription: ごはんの写真を見つけて、撮った場所と時刻から、どのお店で何を食べたかを記録します。
        NSCameraUsageDescription: AI の鍵を受け取るときに、QR コードを読みます。
        NSLocationWhenInUseUsageDescription: いまいる所から近い「また行きたいお店」を選んだり、おうち・職場の場所を覚えたりします。
        NSLocationAlwaysAndWhenInUseUsageDescription: お店で過ごした場所と時間を、写真のお店を当てるのに使います（記録はこの iPhone の中だけ）。また行きたいお店の近くに来たときのお知らせにも使います。
        NSCalendarsFullAccessUsageDescription: 予定の名前と場所を、お店を当てる手がかりにします（設定でオンにしたときだけ）。
        NSFaceIDUsageDescription: ごはん帖を Face ID で開きます（設定でオンにしたときだけ）。
        # 夜などに、アプリを開いていなくても新しい写真を読む（いつ動くかは iOS が決める）
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [com.off53jub.gohan.scan, com.off53jub.gohan.refresh, com.off53jub.gohan.backfill]
        # 「ファイル」アプリにバックアップを置く・.gohan（ふたり帖）や バックアップを開く
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: ふたり帖
            LSHandlerRank: Owner
            LSItemContentTypes: [com.off53jub.gohan.book]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.off53jub.gohan.book
            UTTypeDescription: ふたり帖
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [gohan]
  GohanTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GohanTests]
    dependencies:
      - target: Gohan
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.off53jub.gohan.tests
schemes:
  Gohan:
    build:
      targets:
        Gohan: all
        GohanTests: [test]
    test:
      targets: [GohanTests]
